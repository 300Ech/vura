{% extends "base.html" %}
{% block titulo %}Presentación de {{ proyecto.nombre }}{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h1 class="h4 mb-0">Presentación de «{{ proyecto.nombre }}»</h1>
    <a class="text-muted small" href="{{ url_for('proyectos.ver_proyecto', id_proyecto=proyecto.id) }}">
      Volver al proyecto
    </a>
  </div>
  <span id="estado-guardado" class="text-muted small">
    Última edición: {{ presentacion.actualizado_en.strftime("%d/%m %H:%M") }}
  </span>
</div>

<div id="editor-presentacion" data-id-presentacion="{{ presentacion.id }}" data-id-proyecto="{{ proyecto.id }}">
  <div class="card shadow-sm mb-2">
    <div class="card-body py-2 d-flex flex-wrap align-items-center gap-2">
      <button id="boton-texto" class="btn btn-sm btn-outline-primary" type="button">Texto</button>
      <button id="boton-rectangulo" class="btn btn-sm btn-outline-primary" type="button">Rectángulo</button>
      <button id="boton-circulo" class="btn btn-sm btn-outline-primary" type="button">Círculo</button>
      <button id="boton-imagen" class="btn btn-sm btn-outline-primary" type="button">Imagen</button>
      <label class="d-flex align-items-center gap-1 small mb-0">
        Color
        <input id="selector-color" type="color" value="#2c6ecb" class="form-control form-control-color">
      </label>
      <button id="boton-eliminar-objeto" class="btn btn-sm btn-outline-danger" type="button">Eliminar objeto</button>

      <span class="vr mx-1"></span>

      <div id="lista-diapositivas" class="d-flex gap-1"></div>
      <button id="boton-nueva-diapositiva" class="btn btn-sm btn-success" type="button">+ Diapositiva</button>
      <button id="boton-borrar-diapositiva" class="btn btn-sm btn-outline-danger" type="button">Borrar diapositiva</button>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body d-flex justify-content-center bg-light p-3" style="overflow-x: auto;">
      <div class="border shadow" style="width: 960px;">
        <canvas id="lienzo" width="960" height="540"></canvas>
      </div>
    </div>
  </div>
</div>

<script id="datos-diapositivas" type="application/json">{{ datos_diapositivas | safe }}</script>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.5/client-dist/socket.io.min.js"></script>
<script type="module" src="{{ url_for('presentaciones.static', filename='presentaciones.js') }}"></script>
{% endblock %}
