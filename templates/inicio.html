<!-- este archivo construye la pantalla de bienvenida e inicio de vura. su propósito -->
<!-- es presentar el proyecto a los estudiantes, mostrar las herramientas disponibles -->
<!-- (chat, tareas, pizarra y presentaciones) e invitar a iniciar sesión o crear equipo. -->
<!-- lo hace organizando tarjetas informativas con botones de acceso directo. -->

{% extends "base.html" %}
{% block titulo %}Inicio{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body text-center py-5">
        <h1 class="card-title">Hola, {{ current_user.nombre }} 👋</h1>
        <p class="text-muted">Tu pizarra aparecerá aquí en cuanto tengas un proyecto.</p>
        <p class="text-muted">Crea un equipo (o únete a uno con un código) y luego crea su primer proyecto.</p>
        <a class="btn btn-primary" href="{{ url_for('equipos.mis_equipos') }}">Mis equipos</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
