{% extends "base.html" %}
{% block titulo %}Chat de {{ equipo.nombre }}{% endblock %}

{% block contenido %}
<style>
  .burbuja-chat { position: relative; max-width: 75%; }
  .imagen-chat {
    display: block;
    max-width: 320px;
    max-height: 260px;
    border-radius: 8px;
    cursor: zoom-in;
  }
  .reacciones-chat { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .reaccion-chat {
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: white;
    padding: 1px 7px;
    font-size: 0.8rem;
  }
  .reaccion-chat.mia { background: #ede9fe; border-color: #8b5cf6; }
  .menu-reacciones {
    display: flex;
    gap: 3px;
    margin-top: 4px;
    opacity: 0;
    transition: opacity .15s;
  }
  .burbuja-chat:hover .menu-reacciones { opacity: 1; }
  .menu-reacciones button { border: 0; background: transparent; padding: 1px 3px; }
  #selector-emojis-chat { display: none; }
  #selector-emojis-chat.abierto { display: flex; }
  #visor-imagen-chat {
    position: fixed; inset: 0; z-index: 2500; display: none;
    justify-content: center; align-items: center;
    background: rgba(15,23,42,.8); padding: 24px;
  }
  #visor-imagen-chat.abierto { display: flex; }
  #visor-imagen-chat img { max-width: 90vw; max-height: 88vh; border-radius: 8px; }
</style>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Chat de «{{ equipo.nombre }}»</h1>
  <div>
    <a class="btn btn-success" href="{{ url_for('chat.llamada', id_equipo=equipo.id) }}">📹 Videollamada</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('equipos.ver_equipo', id_equipo=equipo.id) }}">
      Volver al equipo
    </a>
  </div>
</div>

<div id="chat" data-id-equipo="{{ equipo.id }}" data-id-usuario="{{ current_user.id }}"
     class="card shadow-sm">
  <div id="lista-mensajes" class="card-body d-flex flex-column bg-light"
       style="height: 60vh; overflow-y: auto;">
  </div>
  <div id="aviso-escribiendo" class="px-3 small text-muted fst-italic" style="min-height: 1.4em;"></div>
  <div class="card-footer bg-white">
    <div id="selector-emojis-chat" class="gap-1 mb-2">
      {% for emoji in ["😀", "😂", "😍", "🤔", "😮", "😢", "👏", "🙌", "🔥", "✅", "🎉", "❤️"] %}
        <button class="btn btn-sm btn-light emoji-chat" type="button">{{ emoji }}</button>
      {% endfor %}
    </div>
    <form id="formulario-mensaje" class="d-flex gap-2" autocomplete="off">
      <button id="boton-emojis-chat" class="btn btn-outline-secondary" type="button" title="Emojis">😊</button>
      <button id="boton-imagen-chat" class="btn btn-outline-secondary" type="button" title="Adjuntar imagen">📷</button>
      <button id="boton-voz-chat" class="btn btn-outline-secondary" type="button" title="Grabar Voz-it">🎙️</button>
      <input id="campo-texto" class="form-control" maxlength="1000"
             placeholder="Escribe un mensaje..." autofocus>
      <button class="btn btn-primary" type="submit">Enviar</button>
    </form>
    <input id="entrada-imagen-chat" type="file" accept="image/*" class="d-none">
  </div>
</div>

<div id="visor-imagen-chat"><img alt="Imagen ampliada"></div>

<script id="datos-mensajes" type="application/json">{{ datos_mensajes | safe }}</script>
<script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.5/client-dist/socket.io.min.js"></script>
<script src="{{ url_for('chat.static', filename='chat.js') }}"></script>
{% endblock %}
